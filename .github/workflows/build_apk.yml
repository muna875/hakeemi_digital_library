name: Build Hakeemi Digital Library APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate missing Android wrapper and launcher assets
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --org com.hakeemi --project-name hakeemi_digital_library .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run automated QA tests (Tests A-N)
        run: flutter test

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hakeemi-digital-library-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
